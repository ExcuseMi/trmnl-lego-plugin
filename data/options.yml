- keyname: brickset_order_by
  field_type: select
  name: Sort Order
  description: Choose how to sort the sets returned from Brickset.
  options:
  - Set Number: Number
  - Year (Oldest First): YearFrom
  - Year (Newest First): YearFromDESC
  - Piece Count (Low to High): Pieces
  - Piece Count (High to Low): PiecesDESC
  - Minifigures (Low to High): Minifigs
  - Minifigures (High to Low): MinifigsDESC
  - Rating (Low to High): Rating
  - Rating (High to Low): RatingDESC
  - Theme Name: Theme
  - Set Name: Name
  - Random: Random
  - Price (Low to High): RetailPrice
  - Price (High to Low): RetailPriceDESC
  - Price Per Piece (Low to High): PricePerPiece
  - Price Per Piece (High to Low): PricePerPieceDESC
  default: Random
- keyname: show_brick_count
  field_type: select
  name: Show Brick Count
  description: Display the number of pieces included in each set.
  options:
  - Yes, Show Brick Count: 'yes'
  - No, Do Not Display: 'no'
  default: 'yes'
- keyname: show_qr_code
  name: Show QR Code
  field_type: select
  description: Display a QR code linking to the set's details page on the selected data source.
  options:
  - Hide QR Code: hide
  - Show QR Code: show
  default: hide
- keyname: brickset_pricing
  field_type: select
  name: Show Set Price
  description: Display the LEGO® retail price from the official LEGO store in your selected region (when available).
  options:
  - Do Not Show Price: ''
  - Canada (CA): CA
  - Germany (DE): DE
  - United Kingdom (UK): UK
  - United States (US): US
  default: ''
- keyname: brickset_show_minifigs_included
  field_type: select
  name: Show Minifigure Count
  description: Display the number of minifigures included in each set.
  options:
  - Yes, Show Minifigure Count: 'yes'
  - No, Do Not Display: 'no'
  default: 'no'
- keyname: brickset_show_owned_wanted_indicators
  field_type: select
  name: Show Owned & Wanted Indicators
  description: Display the indicators when a set is marked as owned or wanted on Brickset.
  options:
  - Yes, Show Owned & Wanted Indicators: 'yes'
  - No, Do Not Display: 'no'
  default: 'yes'
  conditional_validation:
  - when: 'yes'
    required:
    - brickset_user_hash
- keyname: brickset_owned_wanted
  field_type: select
  name: Filter by Collection Status
  description: Filter results to show only sets you own or want. Requires your Brickset user hash to be configured above.
  options:
  - Show All Sets: ''
  - Only Show Owned Sets: owned
  - Only Show Wanted Sets: wanted
  - Only Show Owned & Wanted Sets: ownedwanted
  default: ''
  optional: true
  conditional_validation:
  - when: owned
    required:
    - brickset_user_hash
  - when: wanted
    required:
    - brickset_user_hash
  - when: ownedwanted
    required:
    - brickset_user_hash
- keyname: min_year
  field_type: number
  name: Minimum Release Year
  description: Show only sets released in or after this year. <strong>For Brickset mode:</strong> at least one theme OR a year range (min/max) is required.
  min: 1900
  optional: true
  placeholder: '1950'
- keyname: max_year
  field_type: number
  name: Maximum Release Year
  description: Show only sets released in or before this year. <strong>For Brickset mode:</strong> at least one theme OR a year range (min/max) is required.
  min: 1900
  optional: true
  placeholder: '2026'
- keyname: min_parts
  field_type: number
  name: Minimum Number of Parts
  description: Show only sets containing at least this many pieces. Applied locally after data retrieval in both modes.
  min: 0
  optional: true
  placeholder: '100'
- keyname: max_parts
  field_type: number
  name: Maximum Number of Parts
  description: Show only sets containing at most this many pieces. Applied locally after data retrieval in both modes.
  min: 0
  optional: true
  placeholder: '5000'
