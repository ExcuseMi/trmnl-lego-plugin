- keyname: about
  name: About This Plugin
  field_type: author_bio
  description: Display LEGO sets on your TRMNL device with flexible filtering and display options.<br /><br /><strong>Dataset:</strong><br />● 15,000+ curated LEGO sets from <a href='https://rebrickable.com/'>Rebrickable.com</a><br />● Sets are sorted by release year, then by set number<br />● Non-LEGO items (watches, bags, etc.), single-piece sets and sets without valid images are excluded<br /><br /><strong>Display Options:</strong><br />● <strong>Random:</strong> Show a different set each refresh<br />● <strong>Incremental:</strong> Progress through sets chronologically<br />● <strong>Reverse Incremental:</strong> Progress backwards from newest to oldest<br /><br /><strong>Filtering Options:</strong><br />● Filter by release year (min/max)<br />● Filter by parent theme (46 available) or specific theme (372 available)<br />● Combine filters to create your perfect collection
  github_url: https://github.com/ExcuseMi/trmnl-lego-plugin
- keyname: display_order
  name: Display Order
  field_type: select
  description: Choose the order in which sets are displayed on your device.
  options:
  - Random (shuffle each refresh): random
  - Chronological (oldest to newest): incremental
  - Reverse Chronological (newest to oldest): reverse_incremental
  default: random
  optional: true
