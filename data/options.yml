- keyname: about
  name: About This Plugin
  field_type: author_bio
  description: 'Display LEGO sets on your TRMNL device with filtering options.<br /><br /><strong>Two Data Modes:</strong><br />● <strong>Curated Dataset (default):</strong> 8,000 pre-selected sets from <a href=''https://rebrickable.com/''>Rebrickable.com</a> (non-LEGO items, micro sets, and sets without images excluded)<br />● <strong>BrickSet API Mode:</strong> Live data from <a href=''https://brickset.com/''>BrickSet.com</a> with access to your collection (requires free API key)<br /><br /><strong>BrickSet Setup (Optional):</strong><br />1. Create a free account at <a href=''https://brickset.com/signup''>brickset.com/signup</a><br />2. Request your API key at <a href=''https://brickset.com/tools/webservices/requestkey''>brickset.com/tools/webservices/requestkey</a><br />3. Enter your API key below to enable BrickSet mode<br />4. (Optional) To show sets you own/want: call the login API method to get your userHash - see <a href=''https://brickset.com/article/52664/api-version-3-documentation''>API
    docs</a> (search for ''login'' method)<br /><br /><strong>Note:</strong> Each data mode has its own theme filter since Rebrickable and BrickSet use different theme naming conventions.'
  github_url: https://github.com/ExcuseMi/trmnl-lego-plugin
  category: life
- keyname: brickset_api_key
  field_type: string
  name: BrickSet API Key (Optional)
  description: Enter your BrickSet API key to use live data from BrickSet instead of the curated dataset. Get your key from <a href="https://brickset.com/tools/webservices/requestkey" target="_blank">brickset.com/tools/webservices/requestkey</a>
  optional: true
  placeholder: Your API key
- keyname: brickset_user_hash
  field_type: string
  name: BrickSet User Hash (Optional)
  description: 'Enter your user hash to filter by sets you own or want. To get it: call the BrickSet login API with your credentials. See the <a href="https://brickset.com/article/52664/api-version-3-documentation" target="_blank">login method documentation</a>. Example: <code>https://brickset.com/api/v3.asmx/login?apiKey=YOUR_KEY&username=YOUR_USERNAME&password=YOUR_PASSWORD</code>'
  optional: true
  placeholder: Your user hash from login API response
- keyname: show_qr_code
  name: Show QR Code
  field_type: select
  description: Display a QR code that links to the set details page
  options:
  - Hide QR Code: hide
  - Show QR Code (Rebrickable): show_rebrickable
  - Show QR Code (BrickSet): show_brickset
  default: hide
  optional: true
- keyname: brickset_pricing
  field_type: select
  name: Show Set Price (BrickSet Only)
  description: <strong>BrickSet mode only:</strong> Show the Lego Sets retail price from LEGO.com
  options:
  - No pricing: ''
  - CA: CA
  - DE: DE
  - UK: UK
  - US: US
  default: ''
  optional: true
- keyname: brickset_show_minifigs_included
  field_type: select
  name: Show minifigs included (BrickSet Only)
  description: <strong>BrickSet mode only:</strong> Show the number of minifigs included
  options:
  - 'Yes': 'yes'
  - 'No': 'no'
  default: 'no'
  optional: true
