- keyname: about
  name: About This Plugin
  field_type: author_bio
  description: 'Display LEGO® sets on your TRMNL device with filtering options using live data from community APIs.<br /><br /><strong>Data Sources:</strong><br />● <strong>Rebrickable Mode (default):</strong> Uses cached data from <a href=''https://rebrickable.com/''>Rebrickable.com</a> with theme and part filters<br />● <strong>BrickSet Mode:</strong> Uses live set data from <a href=''https://brickset.com/''>BrickSet.com</a> with optional personal collection features (owned/wanted), minifigs, and regional pricing<br /><br /><strong>BrickSet Setup (Optional):</strong><br />1. Create a free account at <a href=''https://brickset.com/signup''>brickset.com/signup</a><br />2. Request your API key at <a href=''https://brickset.com/tools/webservices/requestkey''>brickset.com/tools/webservices/requestkey</a><br />3. Enter your API key below to enable BrickSet mode<br />4. (Optional) For owned/wanted filtering: call the login API to get your userHash (see Brickset API docs)<br /><br /><strong>Theme
    Note:</strong> Both APIs use different theme names and categories. Your filter options will automatically change depending on the selected data source.'
  github_url: https://github.com/ExcuseMi/trmnl-lego-plugin
  category: life
- keyname: vendor
  field_type: select
  name: Data Source
  description: Select which LEGO® data source to use.
  options:
  - Rebrickable (Curated Dataset): rebrickable
  - Brickset (Live API): brickset
  default: rebrickable
  conditional_validation:
  - when: brickset
    required:
    - brickset_api_key
    - brickset_user_hash
    - themes_brickset
    - brickset_owned_wanted
    - brickset_pricing
    - brickset_show_minifigs_included
    hidden:
    - themes_rebrickable
  - when: rebrickable
    required:
    - themes_rebrickable
    hidden:
    - brickset_api_key
    - brickset_user_hash
    - themes_brickset
    - brickset_owned_wanted
    - brickset_pricing
    - brickset_show_minifigs_included
- keyname: brickset_api_key
  field_type: string
  name: Brickset API Key (Optional)
  description: Enter your Brickset Web Services API key to enable Brickset mode. Get your key at brickset.com.
  placeholder: Your API key
- keyname: brickset_user_hash
  field_type: string
  name: Brickset User Hash (Optional)
  description: Required to display owned/wanted collections. Obtain it via the Brickset API login method.
  optional: true
  placeholder: Your user hash
