- keyname: about
  name: About This Plugin
  field_type: author_bio
  description: Display LEGO sets on your TRMNL device with filtering options.<br /><br /><strong>Dataset:</strong><br />● 8,000 curated LEGO sets from Rebrickable<br />● Non-LEGO items, micro sets, and sets without images excluded<br />
  github_url: https://github.com/ExcuseMi/trmnl-lego-plugin
- keyname: display_order
  name: Display Order
  field_type: select
  description: Choose how sets are displayed on your device:<br /><strong>Random:</strong> Shows a different set each refresh for variety<br /><strong>Oldest to Newest:</strong> Progress chronologically through LEGO history, starting from vintage sets<br /><strong>Newest to Oldest:</strong> Start with the latest releases and work backwards
  options:
  - Random: random
  - Oldest to Newest: incremental
  - Newest to Oldest: reverse_incremental
  default: random
  optional: true
- keyname: show_qr_code
  name: Show QR Code
  field_type: select
  description: Display a QR code linking to the set details on Rebrickable
  options:
  - Show QR Code: show
  - Hide QR Code: hide
  default: hide
  optional: true
