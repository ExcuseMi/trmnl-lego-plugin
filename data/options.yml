- keyname: about
  name: About This Plugin
  field_type: author_bio
  description: 'Display LEGO® sets on your TRMNL device with powerful filtering options using community APIs.<br /><br /><strong>Data Sources:</strong><br />● <strong>Rebrickable Mode (Default):</strong> Uses curated dataset from <a href=''https://rebrickable.com/''>Rebrickable.com</a> with theme and part count filters<br />● <strong>BrickSet Mode:</strong> Uses live API from <a href=''https://brickset.com/''>BrickSet.com</a> with personal collection features (owned/wanted), minifigure counts, and regional pricing<br /><br /><strong>BrickSet Setup (Optional):</strong><br />1. Create a free account at <a href=''https://brickset.com/signup''>brickset.com/signup</a><br />2. Request your API key at <a href=''https://brickset.com/tools/webservices/requestkey''>brickset.com/tools/webservices/requestkey</a><br />3. Enter your API key in the field below to enable BrickSet mode<br />4. (Optional) For owned/wanted filtering: obtain your userHash via the <a href=''https://brickset.com/article/52664/api-version-3-documentation''>BrickSet
    login API</a><br /><br /><strong>Important Notes:</strong><br />● When using BrickSet mode, you must select at least one theme OR set a min/max year filter OR owned/wanted filter<br />● Filter options automatically adjust based on your selected data source'
  github_url: https://github.com/ExcuseMi/trmnl-lego-plugin
  category: life
- keyname: vendor
  field_type: select
  name: Data Source
  description: Choose which LEGO® data source to use for displaying sets.
  options:
  - Rebrickable (Curated Dataset): rebrickable
  - Brickset (Live API): brickset
  default: rebrickable
  conditional_validation:
  - when: brickset
    required:
    - brickset_api_key
    - brickset_owned_wanted
    - brickset_pricing
    - brickset_show_minifigs_included
    - brickset_order_by
    hidden:
    - themes_rebrickable
  - when: rebrickable
    required:
    - themes_rebrickable
    hidden:
    - brickset_api_key
    - brickset_user_hash
    - themes_brickset
    - brickset_owned_wanted
    - brickset_pricing
    - brickset_show_minifigs_included
    - brickset_order_by
- keyname: brickset_api_key
  field_type: password
  name: Brickset API Key
  description: Your BrickSet API key enables live data access. Request your key at <a href="https://brickset.com/tools/webservices/requestkey" target="_blank">brickset.com/tools/webservices/requestkey</a>
  placeholder: Enter your API key
  optional: true
- keyname: brickset_user_hash
  field_type: password
  name: Brickset User Hash
  description: 'Your user hash enables filtering by sets you own or want. Obtain it by calling the BrickSet login API: <code>https://brickset.com/api/v3.asmx/login?apiKey=YOUR_KEY&username=YOUR_USERNAME&password=YOUR_PASSWORD</code><br />See the <a href="https://brickset.com/article/52664/api-version-3-documentation" target="_blank">login method documentation</a> for details.'
  placeholder: Enter your user hash
  optional: true
